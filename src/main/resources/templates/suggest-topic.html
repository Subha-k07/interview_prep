<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Suggest Topic</title>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            width: 300px;
        }
        label {
            margin-bottom: 5px;
        }
        input[type="text"], textarea {
            padding: 8px;
            margin-bottom: 15px;
            background-color: #333;
            border: 1px solid #555;
            color: #e0e0e0;
            border-radius: 5px;
        }
        textarea {
            height: 100px;
            resize: none;
        }
        .button {
            background-color: #444;
            color: #e0e0e0;
            border: none;
            padding: 10px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px #cccccc,
                       0 0 10px #cccccc,
                       0 0 15px #cccccc;
        }
        .button:hover {
            box-shadow: 0 0 15px #cccccc,
                       0 0 30px #cccccc,
                       0 0 45px #cccccc;
        }
        .submit-button {
            margin-bottom: 20px; /* Add spacing below the submit button */
        }
    </style>
</head>
<body>
<h1>Suggest a Topic</h1>
<form th:action="@{/suggest-topic}" method="post">
    <label for="subject">Subject:</label>
    <input type="text" id="subject" name="subject" required>
    <label for="suggestion">Suggestion:</label>
    <textarea id="suggestion" name="suggestion" required></textarea>
    <button type="submit" class="button submit-button">Submit Suggestion</button>
</form>
<a th:href="@{/student-dashboard}">
    <button class="button">Back to Dashboard</button>
</a>
</body>
</html>
