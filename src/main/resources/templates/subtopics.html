<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Subtopics</title>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        .message {
            font-size: 1.2em;
            color: #ff5555;
            margin-bottom: 20px;
        }
        .debug {
            color: #55ff55;
            margin-bottom: 20px;
        }
        .button-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .subtopic-button {
            background-color: #444;
            color: #e0e0e0;
            border: none;
            padding: 20px;
            font-size: 1.2em;
            width: 150px;
            height: 150px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px #cccccc,
                       0 0 10px #cccccc,
                       0 0 15px #cccccc;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .subtopic-button:hover {
            box-shadow: 0 0 15px #cccccc,
                       0 0 30px #cccccc,
                       0 0 45px #cccccc;
            transform: scale(1.1);
        }
        a {
            text-decoration: none;
        }
        .back-button {
            margin-top: 20px;
            background-color: #444;
            color: #e0e0e0;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px #cccccc,
                       0 0 10px #cccccc,
                       0 0 15px #cccccc;
        }
        .back-button:hover {
            box-shadow: 0 0 15px #cccccc,
                       0 0 30px #cccccc,
                       0 0 45px #cccccc;
        }
    </style>
</head>
<body>
<h1 th:text="${subject} + ' Subtopics'"></h1>
<p th:if="${message}" class="message" th:text="${message}"></p>
<div class="debug" th:text="'Debug - Subtopics size: ' + ${#lists.size(subtopics)}"></div>
<div class="button-container">
    <div th:each="subtopic : ${subtopics}" th:with="subtopicName=${subtopic.name}">
        <a th:href="@{/content/{subject}/{subtopicName}(subject=${subject},subtopicName=${subtopicName})}">
            <button class="subtopic-button" th:text="${subtopicName}"></button>
        </a>
    </div>
</div>
<a th:href="@{/student-dashboard}">
    <button class="back-button">Back to Dashboard</button>
</a>
</body>
</html>
