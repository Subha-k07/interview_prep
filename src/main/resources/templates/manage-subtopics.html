<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Subtopics</title>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        .message {
            margin-bottom: 20px;
            font-size: 1.2em;
        }
        .subtopic-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .subtopic-item {
            background-color: #333;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            width: 200px;
        }
        .button-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        button, input[type="submit"] {
            background-color: #444;
            color: #e0e0e0;
            border: none;
            padding: 10px 15px; /* Adjusted padding for consistent height */
            font-size: 1em;
            width: 150px;
            height: 40px; /* Fixed height for all buttons */
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px #cccccc,
                       0 0 10px #cccccc,
                       0 0 15px #cccccc;
            line-height: 20px; /* Ensure text is vertically centered */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button:hover, input[type="submit"]:hover {
            background-color: #555;
            box-shadow: 0 0 15px #cccccc,
                       0 0 30px #cccccc,
                       0 0 45px #cccccc;
        }
        a {
            text-decoration: none;
        }
    </style>
</head>
<body>
<h1>Manage Subtopics for <span th:text="${subject}"></span></h1>
<p th:if="${message}" class="message" th:text="${message}"></p>
<div class="subtopic-container">
    <div th:each="subtopic : ${subtopics}" class="subtopic-item">
        <h3 th:text="${subtopic.name}"></h3>
        <div class="button-container">
            <form th:action="@{/admin/delete-subtopic}" method="post" style="display:inline;">
                <input type="hidden" name="subtopicName" th:value="${subtopic.name}">
                <input type="hidden" name="subjectName" th:value="${subject}">
                <input type="submit" value="Delete Subtopic" onclick="return confirm('Are you sure you want to delete this subtopic?');">
            </form>
        </div>
    </div>
</div>
<div class="button-container">
    <a th:href="@{/admin/add-subtopic/{subject}(subject=${subject})}">
        <button>Add Subtopic</button>
    </a>
    <a th:href="@{/admin-dashboard}">
        <button>Back to Dashboard</button>
    </a>
</div>
</body>
</html>
