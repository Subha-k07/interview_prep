<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Login</title>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            width: 300px;
        }
        .error {
            color: #ff5555;
            margin-bottom: 10px;
            text-align: center;
        }
        label {
            margin-bottom: 5px;
        }
        input[type="text"], input[type="password"] {
            padding: 8px;
            margin-bottom: 15px;
            background-color: #333;
            border: 1px solid #555;
            color: #e0e0e0;
            border-radius: 5px;
        }
        button {
            background-color: #444;
            color: #e0e0e0;
            border: none;
            padding: 10px;
            font-size: 1em;
            width: 150px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px #cccccc,
                       0 0 10px #cccccc,
                       0 0 15px #cccccc;
        }
        button:hover {
            background-color: #555;
            box-shadow: 0 0 15px #cccccc,
                       0 0 30px #cccccc,
                       0 0 45px #cccccc;
        }
        .button-wrapper {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>
<body>
<h1>Admin Login</h1>
<p th:if="${param.error}" class="error">Invalid username or password. Please try again.</p>
<p th:if="${param.error == 'role'}" class="error">User role not recognized.</p>
<form th:action="@{/login}" method="post">
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>
    <div class="button-wrapper">
        <button type="submit">Sign In</button>
        <a th:href="@{/admin-signup}">
            <button type="button">Sign Up</button>
        </a>
    </div>
</form>
</body>
</html>
