<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Subtopic</title>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            width: 300px;
        }
        label {
            margin-bottom: 5px;
            font-size: 1.1em;
        }
        input[type="text"], input[type="file"] {
            padding: 8px;
            margin-bottom: 15px;
            background-color: #333;
            border: 1px solid #555;
            color: #e0e0e0;
            border-radius: 5px;
        }
        button {
            background-color: #444;
            color: #e0e0e0;
            border: none;
            padding: 10px;
            font-size: 1em;
            width: 150px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px #cccccc,
                       0 0 10px #cccccc,
                       0 0 15px #cccccc;
        }
        button:hover {
            background-color: #555;
            box-shadow: 0 0 15px #cccccc,
                       0 0 30px #cccccc,
                       0 0 45px #cccccc;
        }
        .button-wrapper {
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
<h1>Add Subtopic for <span th:text="${subject}"></span></h1>
<form th:action="@{/admin/add-subtopic}" method="post" enctype="multipart/form-data">
    <input type="hidden" name="subjectName" th:value="${subject}">
    <label for="subtopicName">Subtopic Name:</label>
    <input type="text" id="subtopicName" name="subtopicName" required>
    <label for="pdfMaterial">Upload PDF Material:</label>
    <input type="file" id="pdfMaterial" name="pdfMaterial" accept=".pdf" required>
    <label for="referenceLink">Reference Link (HTTP):</label>
    <input type="text" id="referenceLink" name="referenceLink" placeholder="https://example.com">
    <div class="button-wrapper">
        <button type="submit">Add Subtopic</button>
    </div>
</form>
</body>
</html>
